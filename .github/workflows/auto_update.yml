name: 每日定時台股籌碼爬蟲

on:
  schedule:
    # 💡 國際標準時間 (UTC) 每天 08:30，等於台灣時間 (UTC+8) 每天下午 16:30 (台股收盤資料更新後)
    - cron: '30 8 * * *'
  workflow_dispatch: # 這行可以讓你隨時在網頁上手動點擊執行，不用死等定時

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予機器人把更新後的資料寫回倉庫的權限

    steps:
    - name: 檢查並載入代碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 執行爬蟲計算程式
      run: python crawler.py

    - name: 自動將更新後的資料推送到網頁空間
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add etf_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新今日 ETF 籌碼資料" && git push)
